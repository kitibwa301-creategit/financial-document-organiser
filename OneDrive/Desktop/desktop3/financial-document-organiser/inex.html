<!DOCTYPE html>
<html>
<head>
    <title>My Documents</title>

</head>
<body>
    
    <h1>My Financial Documents</h1>
        <p>Keep your Financial documents organised and easy to find</p>

    <h2>Documents we organise</h2>
    <ul>
        <li>Invoices</li>
        <li>Bank statements</li>
        <li>Receipts</li>
    </ul>

    <button type="button" id="add-document">Add document</button>
    <p id="document-message" aria-live="polite"></p>

    <script>
        document.getElementById("add-document").addEventListener("click", function () {
            const newDocument = document.createElement("li");
            newDocument.textContent = "New document";
            document.querySelector("ul").appendChild(newDocument);
            document.getElementById("document-message").textContent = "Document added";
        });
    </script>
</body>
</html>
